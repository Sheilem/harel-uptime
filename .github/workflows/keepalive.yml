name: keepalive

# GitHub disables scheduled workflows in a repository with no activity for 60 days.
# One small commit a month keeps the uptime check alive.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "harel-uptime"
          git config user.email "harel-uptime@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || echo "nothing to commit"
